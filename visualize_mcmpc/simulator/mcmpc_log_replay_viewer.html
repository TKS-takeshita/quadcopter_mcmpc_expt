<!doctype html><meta charset="utf-8"><title>MCMPC log replay</title>
<style>body{margin:0;background:#10151c;color:#d7e2ee;font:14px system-ui}header{padding:12px 18px;background:#182330;display:flex;gap:18px;align-items:center}main{padding:14px}canvas{width:100%;height:62vh;background:#0b1016;border:1px solid #2b3b4d;border-radius:6px}.charts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}.chart{height:260px;width:100%}input,button{padding:6px;background:#202e3d;color:#d7e2ee;border:1px solid #456078;border-radius:4px}#info{color:#9db0c2}</style>
<header><b>MCMPC log replay (model prediction)</b><input id="f" type="file" accept=".json"><button id="p">再生</button><span id="info">JSONを選択してください</span></header><main><canvas id="c" width="1400" height="760"></canvas><div id="charts" class="charts"></div></main>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),f=document.querySelector('#f'),p=document.querySelector('#p'),info=document.querySelector('#info');let d=null,k=0,playing=false;
f.onchange=()=>{let r=new FileReader();r.onload=()=>{let z=JSON.parse(r.result);if(z.samples){let s=z.samples;let actual=s.map(q=>({t:q.t,x:q.x,y:q.y,z:q.z,vx:q.vx,vy:q.vy,vz:q.vz,wx:q.wx,wy:q.wy,wz:q.wz}));d={source:z.source_csv,actual,predictions:s.map(q=>({start:q.source_row,rows:q.prediction.map((v,h)=>({t:q.t+(h+1)*(z.dt||.02),x:v[7],y:v[8],z:v[9],vx:v[10],vy:v[11],vz:v[12],wx:v[4],wy:v[5],wz:v[6]}))}))}}else d=z;k=0;info.textContent=`${d.source||'replay'} / ${d.actual.length} samples / ${d.predictions.length} predictions`;draw();charts()};r.readAsText(f.files[0])};p.onclick=()=>{playing=!playing;p.textContent=playing?'停止':'再生';if(playing) requestAnimationFrame(loop)};
function loop(){if(!playing)return;k=(k+1)%d.actual.length;draw();requestAnimationFrame(loop)}
function draw(){if(!d)return;let W=c.width,H=c.height;x.clearRect(0,0,W,H);let a=d.actual, all=a.concat(...d.predictions.map(q=>q.rows));let xs=all.map(q=>q.x),ys=all.map(q=>q.y),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),sx=W*.8/(maxx-minx||1),sy=H*.8/(maxy-miny||1),s=Math.min(sx,sy),ox=W*.1-minx*s,oy=H*.9+miny*s;
 const path=(rows,col,lw=2)=>{x.strokeStyle=col;x.lineWidth=lw;x.beginPath();rows.forEach((q,i)=>{let X=ox+q.x*s,Y=oy-q.y*s;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke()};path(a,'#f0a34b',3);d.predictions.forEach((q,i)=>{if(q.start<=k)path(q.rows,i===0?'#48d7ff':'#28667d',i===0?2:1)});let q=a[k];x.fillStyle='#d7e2ee';x.font='16px monospace';x.fillText(`t=${q.t.toFixed(2)}  actual=(${q.x.toFixed(3)}, ${q.y.toFixed(3)}, ${q.z.toFixed(3)})`,18,28);x.fillText('orange: measured   cyan: CUDA-model-equivalent rollout',18,52)}
function charts(){let box=document.querySelector('#charts');box.innerHTML='';['x','y','z','vx','vy','vz','wx','wy','wz'].forEach(name=>{let cv=document.createElement('canvas');cv.className='chart';cv.width=700;cv.height=260;box.appendChild(cv);let g=cv.getContext('2d'),a=d.actual, vals=a.map(q=>q[name]).filter(Number.isFinite),lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo-=1;hi+=1}let X=i=>i/(a.length-1)*680+10,Y=v=>245-(v-lo)/(hi-lo)*220;g.strokeStyle='#405466';g.strokeRect(10,10,680,235);g.strokeStyle='#f0a34b';g.lineWidth=2;g.beginPath();a.forEach((q,i)=>i?g.lineTo(X(i),Y(q[name])):g.moveTo(X(i),Y(q[name])));g.stroke();d.predictions.forEach((pr,j)=>{g.strokeStyle=j===0?'#48d7ff':'#285f76';g.lineWidth=j===0?1.5:1;g.beginPath();pr.rows.forEach((q,i)=>{let xx=X(Math.min(a.length-1,pr.start+i+1));i?g.lineTo(xx,Y(q[name])):g.moveTo(xx,Y(q[name]))});g.stroke()});g.fillStyle='#d7e2ee';g.font='14px monospace';g.fillText(`${name}  measured / CUDA prediction`,18,28);g.fillText(`range ${lo.toFixed(3)} .. ${hi.toFixed(3)}`,18,245)})}
</script>
